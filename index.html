<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body { 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0;
        }
        
        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }
        
        .header-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .header-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
        }
        
        .header-subtitle {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
        }
        
        .status-indicator {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Chat Container */
        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px;
            scroll-behavior: smooth;
        }
        
        #chat-container::-webkit-scrollbar {
            width: 6px;
        }
        
        #chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        
        #chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        
        #chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        /* Messages */
        .message { 
            max-width: 75%; 
            padding: 14px 20px; 
            border-radius: 18px; 
            line-height: 1.6; 
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-out;
            position: relative;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .user { 
            align-self: flex-end; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .ai { 
            align-self: flex-start; 
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .message-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .message-wrapper.user-wrapper {
            align-items: flex-end;
        }
        
        .message-wrapper.ai-wrapper {
            align-items: flex-start;
        }
        
        .message-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            padding: 0 8px;
        }
        
        /* Input Area */
        .input-area { 
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; 
            gap: 12px;
        }
        
        input { 
            flex: 1; 
            padding: 16px 20px; 
            border-radius: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: white; 
            outline: none;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }
        
        button { 
            padding: 16px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            border: none; 
            border-radius: 25px; 
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active:not(:disabled) {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 4px;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }
        
        /* Error & Debug */
        .error { 
            color: #ff6b6b; 
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .debug-box { 
            background: rgba(0, 0, 0, 0.5);
            color: #fbbf24;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.8rem;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid rgba(251, 191, 36, 0.3);
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        
        /* Welcome Message */
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .welcome-message h2 {
            color: #fff;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .welcome-message p {
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        /* Responsive Design */
        @media (max-width: 600px) {
            .header {
                padding: 12px 15px;
            }
            
            .header-title {
                font-size: 1.1rem;
            }
            
            .header-subtitle {
                display: none;
            }
            
            #chat-container {
                padding: 15px;
            }
            
            .message {
                max-width: 85%;
                padding: 12px 16px;
            }
            
            .input-area {
                padding: 15px;
            }
            
            input {
                padding: 14px 18px;
            }
            
            button {
                padding: 14px 20px;
            }
            
            button span.btn-text {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-icon">🤖</div>
        <div>
            <div class="header-title">AI Chat Assistant</div>
            <div class="header-subtitle">Powered by AI</div>
        </div>
        <div class="status-indicator">
            <div class="status-dot"></div>
            <span>Online</span>
        </div>
    </div>

    <div id="chat-container">
        <div class="welcome-message">
            <h2>👋 Vítejte!</h2>
            <p>Napište zprávu a začněte konverzaci s AI asistentem.</p>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Napište zprávu..." onkeypress="handleEnter(event)">
        <button id="send-btn" onclick="sendMessage()">
            <span class="btn-text">Odeslat</span>
            <span>➤</span>
        </button>
    </div>

    <script>
        // ==========================================
        // WEBHOOK URL - Change this to your endpoint
        // ==========================================
        const WEBHOOK_URL = "https://tondait4.serveousercontent.com/webhook/chat";
        
        let isFirstMessage = true;

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const text = inputField.value.trim();

            if (!text) return;

            // Remove welcome message on first message
            if (isFirstMessage) {
                const welcome = document.querySelector('.welcome-message');
                if (welcome) welcome.remove();
                isFirstMessage = false;
            }

            // 1. Display user message
            createMessageElement(text, "user");
            inputField.value = "";
            sendBtn.disabled = true;
            inputField.focus();

            // 2. Create AI bubble with typing indicator
            const aiBubble = createMessageElement("", "ai", true);

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "ngrok-skip-browser-warning": "true",
                        "bypass-tunnel-reminder": "true",
                        "Accept": "application/json, text/plain, */*"
                    },
                    body: JSON.stringify({ message: text })
                });

                // Handle HTTP errors
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status} (${response.statusText})`);
                }

                // Read raw response text
                const rawText = await response.text();
                let finalAnswer = "";
                
                console.log("📥 Raw response:", rawText);
                console.log("📊 Response headers:", [...response.headers.entries()]);

                // --- Parse response: try multiple formats ---
                try {
                    let json = JSON.parse(rawText);
                    console.log("📋 Parsed JSON:", json);

                    // Handle array responses (n8n sometimes returns arrays)
                    if (Array.isArray(json)) {
                        console.log("📦 Response is an array, taking first element");
                        json = json[0];
                    }

                    // Try to find the answer in various common response fields
                    // Extended list of possible field names
                    const possibleFields = [
                        'output', 'content', 'message', 'text', 'answer', 'response', 
                        'reply', 'result', 'data', 'body', 'completion', 'generated_text'
                    ];
                    
                    // Check top-level fields
                    for (const field of possibleFields) {
                        if (json[field] && typeof json[field] === 'string') {
                            finalAnswer = json[field];
                            console.log(`✅ Found answer in field: ${field}`);
                            break;
                        }
                    }
                    
                    // Check nested structures if not found yet
                    if (!finalAnswer) {
                        // OpenAI-style response
                        if (json.choices && json.choices[0]?.message?.content) {
                            finalAnswer = json.choices[0].message.content;
                            console.log("✅ Found answer in choices[0].message.content");
                        }
                        // Alternative OpenAI format
                        else if (json.choices && json.choices[0]?.text) {
                            finalAnswer = json.choices[0].text;
                            console.log("✅ Found answer in choices[0].text");
                        }
                        // n8n format with nested output
                        else if (json.output && typeof json.output === 'object' && json.output.text) {
                            finalAnswer = json.output.text;
                            console.log("✅ Found answer in output.text");
                        }
                        // Response wrapper format
                        else if (json.response && typeof json.response === 'object') {
                            finalAnswer = json.response.text || json.response.content || json.response.message || JSON.stringify(json.response);
                            console.log("✅ Found answer in response object");
                        }
                        // Data wrapper format
                        else if (json.data && typeof json.data === 'object') {
                            finalAnswer = json.data.text || json.data.content || json.data.message || json.data.output || JSON.stringify(json.data);
                            console.log("✅ Found answer in data object");
                        }
                        // If still nothing, stringify the whole object
                        else if (!finalAnswer) {
                            finalAnswer = JSON.stringify(json, null, 2);
                            console.log("⚠️ Using stringified JSON as answer");
                        }
                    }

                } catch (e) {
                    // Not JSON, treat as plain text
                    console.log("📝 Response is plain text, not JSON");
                    finalAnswer = rawText;
                }

                // --- Display result ---
                // Remove typing indicator
                const typingIndicator = aiBubble.querySelector('.typing-indicator');
                if (typingIndicator) typingIndicator.remove();

                if (finalAnswer && finalAnswer.trim().length > 0) {
                    // Clean up quotes if wrapped
                    if (typeof finalAnswer === 'string' && finalAnswer.startsWith('"') && finalAnswer.endsWith('"')) {
                        finalAnswer = finalAnswer.slice(1, -1);
                    }
                    // Handle escaped newlines
                    finalAnswer = finalAnswer.replace(/\\n/g, '\n');
                    // Use innerText for safe text insertion (prevents XSS)
                    aiBubble.innerText = finalAnswer;
                } else {
                    // Debug mode: show raw response for troubleshooting
                    aiBubble.innerHTML = `
                        <span class="error">⚠️ Odpověď je prázdná nebo nerozpoznaná</span>
                        <div class="debug-box">Server odpověděl:<br>${escapeHtml(rawText)}</div>
                    `;
                    console.log("❌ DEBUG - Empty response. Raw data:", rawText);
                }

            } catch (error) {
                // Remove typing indicator on error
                const typingIndicator = aiBubble.querySelector('.typing-indicator');
                if (typingIndicator) typingIndicator.remove();
                
                aiBubble.innerHTML = `<span class="error">⚠️ Chyba spojení: ${escapeHtml(error.message)}</span>`;
                console.error("❌ Connection error:", error);
            } finally {
                sendBtn.disabled = false;
                scrollToBottom();
            }
        }

        function createMessageElement(text, sender, isTyping = false) {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = `message ${sender}`;
            
            if (isTyping) {
                div.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            } else {
                div.innerText = text;
            }
            
            container.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            const container = document.getElementById("chat-container");
            container.scrollTop = container.scrollHeight;
        }

        function handleEnter(e) {
            // Submit on Enter, but allow Shift+Enter for potential future multiline support
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Focus input on page load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('user-input').focus();
        });
    </script>
</body>
</html>
