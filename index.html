<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - TondaIt4</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .message { max-width: 80%; padding: 12px 18px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; font-size: 16px; }
        .user { align-self: flex-end; background-color: #0078d4; color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background-color: #2d2d2d; border: 1px solid #3d3d3d; border-bottom-left-radius: 2px; }
        .input-area { padding: 20px; background-color: #1e1e1e; border-top: 1px solid #333; display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #333; background: #2d2d2d; color: white; outline: none; font-size: 16px; }
        button { padding: 0 25px; background-color: #0078d4; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #0063b1; }
        button:disabled { background-color: #444; cursor: not-allowed; }
        .typing::after { content: '...'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 100% { content: ''; } }
        .error { color: #ff5555; font-size: 14px; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message ai">Ahoj! Jsem připraven.</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Napiš zprávu..." autocomplete="off">
        <button id="send-btn">Odeslat</button>
    </div>

    <script>
        // TVŮJ WEBHOOK
        const WEBHOOK_URL = "http://localhost:5678/webhook/af56d482-dfcc-461a-bd26-0e7421b304a6";

        const inputField = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chatContainer = document.getElementById("chat-container");

        inputField.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
        sendBtn.addEventListener("click", sendMessage);

        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            addMessage(text, "user");
            inputField.value = "";
            sendBtn.disabled = true;
            const aiBubble = addMessage("", "ai", true);

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chatInput: text, message: text })
                });

                // Získáme textovou odpověď (ne JSON rovnou, aby to nespadlo)
                const rawText = await response.text();

                if (!response.ok) throw new Error(`Server vrátil: ${response.status}`);
                if (!rawText) throw new Error("Server vrátil prázdnou odpověď (zkontroluj n8n Respond Node!)");

                let aiText = rawText;

                // Pokusíme se to parsovat jako JSON, pokud to jde
                try {
                    const data = JSON.parse(rawText);
                    aiText = data.output || data.text || data.message || data.content || JSON.stringify(data);
                } catch (e) {
                    // Pokud to není JSON, necháme to jako text (n8n někdy pošle jen string)
                    console.log("Odpověď není JSON, zobrazuji jako text.");
                }

                aiBubble.classList.remove("typing");
                aiBubble.innerText = aiText;

            } catch (error) {
                console.error(error);
                aiBubble.classList.remove("typing");
                aiBubble.innerHTML = `<span class="error">⚠️ Chyba: ${error.message}</span>`;
            } finally {
                sendBtn.disabled = false;
                inputField.focus();
                scrollToBottom();
            }
        }

        function addMessage(text, sender, isTyping = false) {
            const div = document.createElement("div");
            div.className = `message ${sender}`;
            if (isTyping) div.classList.add("typing");
            div.innerText = text;
            chatContainer.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
