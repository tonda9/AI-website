        .message { max-width: 80%; padding: 12px 18px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; font-size: 16px; }

        button:hover { background-color: #0063b1; }
        button:disabled { background-color: #444; cursor: not-allowed; }
        .typing::after { content: '...'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 100% { content: ''; } }

        // 💬 CHAT LOGIKA

        const inputField = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const chatContainer = document.getElementById("chat-container");

        inputField.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
        sendBtn.addEventListener("click", sendMessage);

        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            addMessage(text, "user");
            inputField.value = "";
            sendBtn.disabled = true;
            
            // Bublina "Grussy píše..."
            const aiBubble = addMessage("Grussy píše...", "ai", true);

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chatInput: text, message: text })
                });

                const rawText = await response.text();

                if (!response.ok) throw new Error(`Server error: ${response.status}`);
                if (!rawText) throw new Error("Prázdná odpověď.");

                let aiText = rawText;
                try {
                    const data = JSON.parse(rawText);
                    aiText = data.output || data.text || data.message || data.content || JSON.stringify(data);
                } catch (e) {}

                // PŘIDÁNÍ "Grussy říká:"
                if (!aiText.startsWith("Grussy")) {
                    aiText = "Grussy říká: " + aiText;
                }

                aiBubble.classList.remove("typing");
                aiBubble.innerText = aiText;

            } catch (error) {
                console.error(error);
                aiBubble.classList.remove("typing");
                aiBubble.innerHTML = `<span class="error">⚠️ Chyba: ${error.message}</span>`;
            } finally {
                sendBtn.disabled = false;
                inputField.focus();
                scrollToBottom();
            }
        }

        function addMessage(text, sender, isTyping = false) {
            const div = document.createElement("div");
            div.className = `message ${sender}`;
            if (isTyping) div.classList.add("typing");
            div.innerText = text;
            chatContainer.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
