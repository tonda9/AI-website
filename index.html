<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Final Fix</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 18px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background-color: #0078d4; color: white; border-bottom-right-radius: 2px; text-align: right; }
        .ai { align-self: flex-start; background-color: #2d2d2d; border: 1px solid #3d3d3d; border-bottom-left-radius: 2px; text-align: left; }
        .input-area { padding: 20px; background-color: #1e1e1e; border-top: 1px solid #333; display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #333; background: #2d2d2d; color: white; outline: none; }
        button { padding: 0 25px; background-color: #0078d4; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .typing::after { content: '...'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 100% { content: ''; } }
        .error { color: #ff5555; font-weight: bold; }
        .debug-box { background: #000; color: #ffa500; font-family: monospace; font-size: 12px; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ffa500; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div id="chat-container"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Napiš zprávu..." onkeypress="handleEnter(event)">
        <button id="send-btn" onclick="sendMessage()">Odeslat</button>
    </div>

    <script>
        // ==========================================
        // ZDE SI ZKONTROLUJ ADRESU
        // ==========================================
        const WEBHOOK_URL = "https://tondait4.serveousercontent.com/webhook/chat";

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const text = inputField.value.trim();

            if (!text) return;

            // 1. Zobraz uživatele
            createMessageElement(text, "user");
            inputField.value = "";
            sendBtn.disabled = true;

            // 2. AI bublina
            const aiBubble = createMessageElement("", "ai", true);

            try {
                // Přidáváme speciální hlavičky, aby to prošlo přes tunel
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "ngrok-skip-browser-warning": "true",
                        "bypass-tunnel-reminder": "true"
                    },
                    body: JSON.stringify({ message: text })
                });

                // Pokud server vrátí chybu (např. 404 nebo 500)
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status} (${response.statusText})`);
                }

                // Přečteme odpověď jako surový text
                const rawText = await response.text();
                let finalAnswer = "";

                // --- 🔍 DETEKTIVNÍ PRÁCE: Hledáme odpověď ---
                try {
                    let json = JSON.parse(rawText);

                    // 1. Pokud je to pole (n8n to někdy dělá), vezmeme první prvek
                    if (Array.isArray(json)) {
                        json = json[0];
                    }

                    // 2. Hledáme text všude možně
                    if (json.output) finalAnswer = json.output;
                    else if (json.content) finalAnswer = json.content;
                    else if (json.message) finalAnswer = json.message;
                    else if (json.choices && json.choices[0]?.message?.content) {
                        finalAnswer = json.choices[0].message.content; // Přímo od AI
                    }
                    else if (json.text) finalAnswer = json.text;
                    else {
                        // Pokud je to JSON, ale divný, převedeme ho celý na text, ať vidíme, co to je
                        finalAnswer = JSON.stringify(json);
                    }

                } catch (e) {
                    // Není to JSON, je to čistý text
                    finalAnswer = rawText;
                }

                // --- 🏁 VÝPIS VÝSLEDKU ---
                aiBubble.classList.remove("typing");

                if (finalAnswer && finalAnswer.trim().length > 0) {
                    // Máme odpověď! Vyčistíme uvozovky, pokud jsou na začátku a konci
                    if (typeof finalAnswer === 'string' && finalAnswer.startsWith('"') && finalAnswer.endsWith('"')) {
                        finalAnswer = finalAnswer.slice(1, -1);
                    }
                    aiBubble.innerText = finalAnswer;
                } else {
                    // --- 🛑 DEBUG MÓD: Když je odpověď prázdná ---
                    aiBubble.innerHTML = `
                        <span class="error">⚠️ Nevidím text odpovědi</span>
                        <div class="debug-box">Server poslal tato data (zkopíruj mi to):<br>${rawText.replace(/</g, "&lt;")}</div>
                    `;
                    console.log("DEBUG RAW:", rawText);
                }

            } catch (error) {
                aiBubble.classList.remove("typing");
                aiBubble.innerHTML = `<span class="error">Chyba spojení: ${error.message}</span>`;
            } finally {
                sendBtn.disabled = false;
                scrollToBottom();
            }
        }

        function createMessageElement(text, sender, isTyping = false) {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = `message ${sender}`;
            if (isTyping) div.classList.add("typing");
            div.innerText = text;
            container.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            const container = document.getElementById("chat-container");
            container.scrollTop = container.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === "Enter") sendMessage();
        }
    </script>
</body>
</html>
