<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat V3 (Final)</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 18px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background-color: #0078d4; color: white; border-bottom-right-radius: 2px; text-align: right; }
        .ai { align-self: flex-start; background-color: #2d2d2d; border: 1px solid #3d3d3d; border-bottom-left-radius: 2px; text-align: left; }
        .input-area { padding: 20px; background-color: #1e1e1e; border-top: 1px solid #333; display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #333; background: #2d2d2d; color: white; outline: none; }
        button { padding: 0 25px; background-color: #0078d4; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .typing::after { content: '...'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 100% { content: ''; } }
        .error { color: #ff5555; }
    </style>
</head>
<body>

    <div id="chat-container"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Napiš zprávu..." onkeypress="handleEnter(event)">
        <button id="send-btn" onclick="sendMessage()">Odeslat</button>
    </div>

    <script>
        // ==========================================
        // ZDE DEJ TU SVOJI CLOUDFLARE ADRESU
        // Nezapomeň na HTTPS a koncovku /webhook/chat
        // ==========================================
       // ZKONTROLUJ TENTO ŘÁDEK VE SVÉM HTML:
    const WEBHOOK_URL = "https://tondait4.serveousercontent.com/webhook/chat";

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const text = inputField.value.trim();

            if (!text) return;

            // 1. Zobrazíme uživatele
            createMessageElement(text, "user");
            inputField.value = "";
            sendBtn.disabled = true;

            // 2. Vytvoříme bublinu pro AI (a držíme si ji v proměnné aiBubble)
            const aiBubble = createMessageElement("", "ai", true);

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error(`HTTP Chyba: ${response.status}`);

                // Přečteme odpověď jako text
                const rawText = await response.text();
                let finalAnswer = "";

                // --- LOGIKA ČTENÍ ODPOVĚDI (Vylepšená) ---

                // Pokus 1: Je to n8n JSON stream?
                const lines = rawText.split('\n');
                for (const line of lines) {
                    if (!line.trim()) continue;
                    try {
                        const json = JSON.parse(line);
                        // Hledáme text uvnitř JSONu
                        if (json.content) finalAnswer += json.content;
                        else if (json.output) finalAnswer += json.output;
                        else if (json.json && json.json.content) finalAnswer += json.json.content;
                    } catch (e) {
                        // Není to JSON, ignorujeme
                    }
                }

                // Pokus 2: Pokud JSON nic nenašel, je to prostě čistý text? (Tvůj případ!)
                if (!finalAnswer && rawText.trim().length > 0) {
                    // Pokud to nevypadá jako systémová zpráva n8n, použijeme to celé
                    if (!rawText.includes('{"type":')) {
                        finalAnswer = rawText;
                    }
                }

                // --- VÝPIS ---
                aiBubble.classList.remove("typing");

                if (finalAnswer) {
                    aiBubble.innerText = finalAnswer;
                } else {
                    // Pokud je odpověď opravdu prázdná
                    aiBubble.innerHTML = "<span class='error'>Server nic neodpověděl.</span>";
                    console.log("Raw Response:", rawText);
                }

            } catch (error) {
                aiBubble.classList.remove("typing");
                aiBubble.innerHTML = `<span class='error'>Chyba: ${error.message}</span>`;
            } finally {
                sendBtn.disabled = false;
                scrollToBottom();
            }
        }

        // Funkce pro vytvoření bubliny (vrací přímo HTML element, ne ID)
        function createMessageElement(text, sender, isTyping = false) {
            const container = document.getElementById("chat-container");
            const div = document.createElement("div");
            div.className = `message ${sender}`;
            if (isTyping) div.classList.add("typing");
            div.innerText = text;
            container.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() {
            const container = document.getElementById("chat-container");
            container.scrollTop = container.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === "Enter") sendMessage();
        }
    </script>
</body>
</html>
